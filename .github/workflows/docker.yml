name: Build and Push Docker Image

on:
  push:
    branches: [master, feature/omnichannel]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=omni" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (debug)
        run: npm install --legacy-peer-deps --include=optional

      - name: Next.js build (debug)
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          OPENROUTER_API_KEY: dummy
          APPWRITE_ENDPOINT: http://localhost/v1
          APPWRITE_PROJECT_ID: dummy
          APPWRITE_API_KEY: dummy
          APPWRITE_DATABASE_ID: dummy
          NODE_OPTIONS: "--max-old-space-size=1536"
        run: npx next build --no-lint 2>&1

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/kike9083/agente-wasap-claude:${{ steps.tag.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
